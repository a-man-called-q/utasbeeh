name: tasbeeh
description: Dzikir counter dan Qur'an reader.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../../packages/design_system
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  dzikir_core:
    path: ../../packages/dzikir_core
  quran_core:
    path: ../../packages/quran_core
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tasbeeh-icon.png
    - packages/quran_core/content/quran-uthmani.txt
    - packages/quran_core/content/en.pickthall.txt
    - packages/dzikir_core/content/dzikir.json
