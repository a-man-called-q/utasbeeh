language: "dart"
layer: "library"
tags: ["flutter"]

project:
  title: "design_system"
  description: "Mix tokens, themes and GlassSurface."

fileGroups:
  sources:
    - "lib/**/*"
    - "pubspec.yaml"
    - "analysis_options.yaml"
  tests:
    - "test/**/*"

tasks:
  analyze:
    command: "flutter analyze"
    toolchains: "system"
    inputs: ["@group(sources)", "@group(tests)"]

  format:
    command: "dart format --output=none --set-exit-if-changed lib test"
    toolchains: "system"
    inputs: ["@group(sources)", "@group(tests)"]

  test:
    command: "flutter test"
    toolchains: "system"
    inputs: ["@group(sources)", "@group(tests)"]
