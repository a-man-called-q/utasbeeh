name: design_system
description: Token, tema, dan komponen dasar (Mix) untuk aplikasi Tasbeeh.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: ^1.0.0-dev.1
  mix: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Both SIL OFL 1.1; licenses in fonts/OFL-*.txt.
    - family: AmiriQuran
      fonts:
        - asset: fonts/AmiriQuran-Regular.ttf
    - family: Newsreader
      fonts:
        - asset: fonts/Newsreader-Variable.ttf
        - asset: fonts/Newsreader-Italic-Variable.ttf
          style: italic
